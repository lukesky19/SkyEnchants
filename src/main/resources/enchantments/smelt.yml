# DO NOT TOUCH! This is used to update the config file format if needed.
version: 1
# WARNING! Disabling an enchantment will result in the enchantment being removed from ItemStacks.
# Enabling or disabling enchantments requires a server restart.
enabled: true
# Changing these values requires a server restart.
registration:
    # Changing the max level will not remove enchantments higher than the max level for any items.
    # For Shield Bash, the effect will not apply if the enchantment level is higher than the max level though.
    max-level: 3
    # Should the enchantment be shown in enchantment tables?
    show-in-enchantment-table: false
    # This is only relevant if custom enchants use in anvils is enabled.
    anvil-cost: 1
    # weight is only relevant if it is shown inside enchantment tables.
    weight: 1
    # The minimum and maximum cost refers to the selection enchantments.
    # See https://minecraft.wiki/w/Enchanting/Levels for more information.
    minimum-cost:
        base-cost: 1
        additional-cost-per-level: 1
    maximum-cost:
        base-cost: 3
        additional-cost-per-level: 1
    # The list of equipment slots the enchantment may be active in. Invalid values will be ignored.
    # Possible values: ANY, MAINHAND, OFFHAND, HAND, FEET, LEGS, CHEST, HEAD, ARMOR, BODY, SADDLE
    # See https://jd.papermc.io/paper/1.21.11/org/bukkit/inventory/EquipmentSlotGroup.html
    equipment-slots:
        - MAINHAND
    # The items this enchantment can be applied to.
    supported-items:
        - wooden_pickaxe
        - stone_pickaxe
        - copper_pickaxe
        - iron_pickaxe
        - golden_pickaxe
        - diamond_pickaxe
        - netherite_pickaxe
        - wooden_shovel
        - stone_shovel
        - copper_shovel
        - iron_shovel
        - golden_shovel
        - diamond_shovel
        - netherite_shovel
        - wooden_axe
        - stone_axe
        - copper_axe
        - iron_axe
        - golden_axe
        - diamond_axe
        - netherite_axe
# This refers to the chance that the enchantment is applied
# Percentage is calculated as a decimal, i.e., 0.70 for 70%.
chance-per-level:
    1: 0.20
    2: 0.40
    3: 0.60